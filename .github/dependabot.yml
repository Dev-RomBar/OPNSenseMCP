# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Fork: no upstream reviewer, a 7-day cooldown and the Docker base images. The
# dependabot-reviewer agent (dev-rombar/devbox) reviews these pull requests.

version: 2
updates:
  # Bun dependencies.
  #
  # This MUST stay "bun" rather than "npm" now that the repo uses bun.lock.
  # The npm ecosystem updates package.json but never regenerates bun.lock, so
  # every PR it opened would arrive with a drifted lockfile and fail
  # `bun install --frozen-lockfile` in CI.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "bun"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Group minor and patch updates together
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "eslint*"
          - "prettier"
          - "typescript"
          - "jest"
          - "tsx"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "prettier"
          - "typescript"
          - "jest"
          - "tsx"
          - "drizzle-kit"
        update-types:
          - "minor"
          - "patch"
    # Note: zod v4 and drizzle-orm 0.45+ are now supported
    # Only ignore packages with known compatibility issues
    ignore: []

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"

  # Docker base images (Dockerfile)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
